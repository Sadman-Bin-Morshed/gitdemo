<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CSE-</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <main class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold text-slate-800 mb-4">CSE-2340 App Login</h1>
    <form id="auth-form" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" type="email" required class="w-full border p-2 rounded mt-1" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input id="password" type="password" required minlength="6" class="w-full border p-2 rounded mt-1" />
      </div>
      <p id="auth-error" class="text-sm text-red-600 hidden"></p>
      <div class="flex gap-2">
        <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded">Sign In</button>
        <button type="button" id="register-btn" class="flex-1 bg-slate-700 text-white py-2 rounded">Register</button>
      </div>
    </form>
  </main>
  <script type="module" src="/src/auth.js"></script>
</body>
</html>
